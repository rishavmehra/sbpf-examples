[package]
name = "r11-stack-args"
version = "0.1.0"
edition = "2021"
description = "Repro: a 6-argument call spills the extra arg to the stack via R11, which SVM does not support"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-compiler-builtins = { git = "https://github.com/blueshift-gg/solana-compiler-builtins", branch = "main" }

[dev-dependencies]
mollusk-svm = "0.14.0"
solana-instruction = "3.4.0"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3

[workspace]
