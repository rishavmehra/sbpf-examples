[package]
name = "ptoken-repro-parse-u64-noinline"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"

[target.'cfg(target_arch = "bpf")'.dependencies]
solana-compiler-builtins = { git = "https://github.com/blueshift-gg/solana-compiler-builtins", branch = "main" }

[workspace]
