[package]
name = "rust-bpf-abi-regression"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rust_bpf_abi_regression"
crate-type = ["cdylib"]

[dependencies]
pinocchio = "=0.9.3"
solana-compiler-builtins = { git = "https://github.com/blueshift-gg/solana-compiler-builtins", branch = "main" }

[dev-dependencies]
mollusk-svm = "=0.15.1"
solana-bpf-loader-program = "=4.2.2"
solana-compute-budget = "=4.2.2"
solana-instruction = "3.0.0"
solana-pubkey = "4.0.0"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_feature, values("static-syscalls"))',
]
