[package]
name = "ptoken-mollusk-v3"
version = "0.1.0"
edition = "2021"
description = "Runs a real p-token instruction in mollusk 0.14 (v3-aware) against the r11->r10 rewritten .so"

# Standalone workspace so it resolves its own deps (mollusk 0.14 + matching
# solana crates), avoiding p-token's pinned-0.11 workspace conflict.
[workspace]

[dev-dependencies]
mollusk-svm = "0.14.0"
solana-account = "4.3.0"
solana-instruction = "3.2.0"
solana-pubkey = "4.1.0"
